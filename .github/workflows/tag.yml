name: Tag

# Tagging is driven by the module's own version number.
#
# Day-to-day development happens on Bitbucket. Pushing main to GitHub is what
# makes a release: this workflow reads $this->version from the module, and when
# that version has no tag yet it creates one and hands off to release.yml.
#
# Bumping the version in a commit is therefore the act of cutting a release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    name: Tag the module version
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.check.outputs.created }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the module version
        id: version
        run: |
          MAIN=$(grep -oP "(?<=\\\$this->version = ')[^']+" \
            briqpay_payment_module/briqpay_payment_module.php)
          XML=$(grep -oP '(?<=<version><!\[CDATA\[)[^\]]+' \
            briqpay_payment_module/config.xml)

          echo "module:     $MAIN"
          echo "config.xml: $XML"

          if [ "$MAIN" != "$XML" ]; then
            echo "::error::Version mismatch between the module file and config.xml"
            exit 1
          fi

          if ! printf '%s' "$MAIN" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$MAIN' is not semver"
            exit 1
          fi

          echo "version=$MAIN" >> "$GITHUB_OUTPUT"

      - name: Create the tag if this version is new
        id: check
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists, nothing to do."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! grep -q "^## \[${{ steps.version.outputs.version }}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no [${{ steps.version.outputs.version }}] section"
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Briqpay for PrestaShop $TAG"
          git push origin "$TAG"

          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Created $TAG"

  release:
    name: Release
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.tag }}
